<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Basics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>HTML Basics</h1>
    <p>The header groups the introduction and main heading of the page.</p>
  </header>

  <main>
    <p>The paragraph tag displays a block of text.</p>

    <table border="1">
      <tr>
        <th>Tag</th>
        <th>Function</th>
      </tr>
      <tr>
        <td>Table</td>
        <td>Displays data in rows and columns.</td>
      </tr>
    </table>

    <p>The button tag creates a clickable button. <button type="button">Click Me</button></p>
  </main>

  <footer>
    <p>The footer holds the content at the bottom of the page.</p>
  </footer>
</body>
</html>
